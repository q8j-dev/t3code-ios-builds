name: Build iOS iPA

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-ios-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios:
    name: Build iOS iPA
    runs-on: macos-26
    timeout-minutes: 120

    env:
      CI: "1"
      APP_VARIANT: production
      EXPO_NO_GIT_STATUS: "1"
      T3CODE_REF: main
      T3CODE_IOS_PERSONAL_TEAM: "1"
      T3CODE_IOS_PERSONAL_TEAM_BUNDLE_ID: com.t3.t3code
      SOURCE_DIR: ${{ github.workspace }}/source

    steps:
      - name: Download T3 Code source without Git checkout
        shell: bash
        run: |
          set -euo pipefail

          ARCHIVE="$RUNNER_TEMP/t3code-source.tar.gz"

          rm -rf "$SOURCE_DIR"
          mkdir -p "$SOURCE_DIR"

          curl \
            --fail \
            --location \
            --retry 5 \
            --retry-all-errors \
            "https://codeload.github.com/pingdotgg/t3code/tar.gz/refs/heads/$T3CODE_REF" \
            --output "$ARCHIVE"

          tar \
            -xzf "$ARCHIVE" \
            -C "$SOURCE_DIR" \
            --strip-components=1

          test -f "$SOURCE_DIR/package.json"
          test -f "$SOURCE_DIR/pnpm-lock.yaml"
          test -f "$SOURCE_DIR/apps/mobile/package.json"

          echo "T3 Code source downloaded to: $SOURCE_DIR"

      - name: Select Xcode 26.6
        shell: bash
        run: |
          set -euo pipefail

          XCODE_PATH="/Applications/Xcode_26.6.app"

          if [[ ! -d "$XCODE_PATH" ]]; then
            echo "::error::Xcode 26.6 was not found."
            echo "Installed Xcode applications:"
            ls -1 /Applications | grep '^Xcode' || true
            exit 1
          fi

          sudo xcode-select \
            --switch "$XCODE_PATH/Contents/Developer"

          echo "Xcode:"
          xcodebuild -version

          echo "Swift:"
          xcrun swift --version

          echo "iOS SDK:"
          xcrun --sdk iphoneos --show-sdk-version

      - name: Set up Node 24
        uses: actions/setup-node@v7
        with:
          node-version: "24.18.0"
          package-manager-cache: false

      - name: Install pnpm
        shell: bash
        run: |
          set -euo pipefail

          npm install --global pnpm@11.10.0

          echo "Node:"
          node --version

          echo "npm:"
          npm --version

          echo "pnpm:"
          pnpm --version

          echo "CocoaPods:"
          pod --version

      - name: Install JavaScript dependencies
        working-directory: ${{ github.workspace }}/source
        shell: bash
        run: |
          set -euo pipefail

          pnpm install \
            --frozen-lockfile \
            --reporter=append-only

      - name: Generate native iOS project
        working-directory: ${{ github.workspace }}/source/apps/mobile
        shell: bash
        run: |
          set -euo pipefail
          set -o pipefail

          rm -rf ios build output

          pnpm exec expo prebuild \
            --clean \
            --platform ios \
            2>&1 | tee expo-prebuild.log

      - name: Install CocoaPods dependencies
        working-directory: ${{ github.workspace }}/source/apps/mobile
        shell: bash
        run: |
          set -euo pipefail
          set -o pipefail

          pod install \
            --project-directory=ios \
            2>&1 | tee pod-install.log

      - name: Locate Xcode workspace and scheme
        id: xcode
        working-directory: ${{ github.workspace }}/source/apps/mobile
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          WORKSPACE=""

          for candidate in ios/*.xcworkspace; do
            if [[ "$(basename "$candidate")" != "Pods.xcworkspace" ]]; then
              WORKSPACE="$candidate"
              break
            fi
          done

          if [[ -z "$WORKSPACE" ]]; then
            echo "::error::No application Xcode workspace was found."
            find ios -print || true
            exit 1
          fi

          PROJECT=""

          for candidate in ios/*.xcodeproj; do
            if [[ "$(basename "$candidate")" != "Pods.xcodeproj" ]]; then
              PROJECT="$candidate"
              break
            fi
          done

          if [[ -z "$PROJECT" ]]; then
            echo "::error::No application Xcode project was found."
            find ios -print || true
            exit 1
          fi

          PROJECT_NAME="$(basename "$PROJECT" .xcodeproj)"
          PREFERRED_SCHEME="$PROJECT/xcshareddata/xcschemes/$PROJECT_NAME.xcscheme"
          SCHEME_FILE=""

          if [[ -f "$PREFERRED_SCHEME" ]]; then
            SCHEME_FILE="$PREFERRED_SCHEME"
          else
            for candidate in "$PROJECT"/xcshareddata/xcschemes/*.xcscheme; do
              SCHEME_FILE="$candidate"
              break
            done
          fi

          if [[ -z "$SCHEME_FILE" || ! -f "$SCHEME_FILE" ]]; then
            echo "::error::No shared application Xcode scheme was found."
            find ios -name '*.xcscheme' -print || true
            exit 1
          fi

          SCHEME="$(basename "$SCHEME_FILE" .xcscheme)"

          if [[ -z "$SCHEME" ]]; then
            echo "::error::The detected scheme name is empty."
            exit 1
          fi

          echo "Workspace: $WORKSPACE"
          echo "Project:   $PROJECT"
          echo "Scheme:    $SCHEME"

          {
            echo "workspace=$WORKSPACE"
            echo "project=$PROJECT"
            echo "scheme=$SCHEME"
          } >> "$GITHUB_OUTPUT"

      - name: Build unsigned Release application
        working-directory: ${{ github.workspace }}/source/apps/mobile
        shell: bash
        run: |
          set -euo pipefail
          set -o pipefail

          rm -rf build
          mkdir -p build/SourcePackages

          NSUnbufferedIO=YES xcodebuild \
            -workspace "${{ steps.xcode.outputs.workspace }}" \
            -scheme "${{ steps.xcode.outputs.scheme }}" \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$PWD/build" \
            -clonedSourcePackagesDirPath "$PWD/build/SourcePackages" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            EXPANDED_CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            AD_HOC_CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            build \
            2>&1 | tee xcodebuild.log

      - name: Locate built T3 Code application
        id: app
        working-directory: ${{ github.workspace }}/source/apps/mobile
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          PRODUCTS_DIRECTORY="$PWD/build/Build/Products/Release-iphoneos"
          EXPECTED_BUNDLE_ID="$T3CODE_IOS_PERSONAL_TEAM_BUNDLE_ID"
          APP_PATH=""

          if [[ ! -d "$PRODUCTS_DIRECTORY" ]]; then
            echo "::error::The Release-iphoneos products directory does not exist."
            find build -print || true
            exit 1
          fi

          for candidate in "$PRODUCTS_DIRECTORY"/*.app; do
            INFO_PLIST="$candidate/Info.plist"

            if [[ ! -f "$INFO_PLIST" ]]; then
              continue
            fi

            BUNDLE_ID="$(
              /usr/libexec/PlistBuddy \
                -c 'Print :CFBundleIdentifier' \
                "$INFO_PLIST" \
                2>/dev/null || true
            )"

            echo "Found app candidate: $candidate"
            echo "Candidate bundle ID: $BUNDLE_ID"

            if [[ "$BUNDLE_ID" == "$EXPECTED_BUNDLE_ID" ]]; then
              APP_PATH="$candidate"
              break
            fi
          done

          if [[ -z "$APP_PATH" ]]; then
            echo "::error::No app with bundle ID $EXPECTED_BUNDLE_ID was found."
            find "$PRODUCTS_DIRECTORY" -print || true
            exit 1
          fi

          EXECUTABLE_NAME="$(
            /usr/libexec/PlistBuddy \
              -c 'Print :CFBundleExecutable' \
              "$APP_PATH/Info.plist"
          )"

          if [[ ! -f "$APP_PATH/$EXECUTABLE_NAME" ]]; then
            echo "::error::The built app executable is missing."
            exit 1
          fi

          echo "Built app:  $APP_PATH"
          echo "Bundle ID:  $EXPECTED_BUNDLE_ID"
          echo "Executable: $EXECUTABLE_NAME"

          {
            echo "path=$APP_PATH"
            echo "bundle_id=$EXPECTED_BUNDLE_ID"
          } >> "$GITHUB_OUTPUT"

      - name: Remove any existing signing data
        working-directory: ${{ github.workspace }}/source/apps/mobile
        shell: bash
        run: |
          set -euo pipefail

          APP_PATH="${{ steps.app.outputs.path }}"

          find "$APP_PATH" \
            -type d \
            -name '_CodeSignature' \
            -prune \
            -exec rm -rf '{}' +

          find "$APP_PATH" \
            -type f \
            \( \
              -name 'embedded.mobileprovision' \
              -o -name 'CodeResources' \
            \) \
            -exec rm -f '{}' +

          echo "Signing-related files remaining:"
          find "$APP_PATH" \
            \( \
              -name '_CodeSignature' \
              -o -name 'embedded.mobileprovision' \
              -o -name 'CodeResources' \
            \) \
            -print || true

      - name: Package unsigned IPA
        working-directory: ${{ github.workspace }}/source/apps/mobile
        shell: bash
        run: |
          set -euo pipefail
          set -o pipefail

          APP_PATH="${{ steps.app.outputs.path }}"
          APP_NAME="$(basename "$APP_PATH")"

          OUTPUT_DIRECTORY="$PWD/output"
          PAYLOAD_DIRECTORY="$OUTPUT_DIRECTORY/Payload"
          IPA_PATH="$OUTPUT_DIRECTORY/T3-Code-unsigned.ipa"

          rm -rf "$OUTPUT_DIRECTORY"
          mkdir -p "$PAYLOAD_DIRECTORY"

          /usr/bin/ditto \
            "$APP_PATH" \
            "$PAYLOAD_DIRECTORY/$APP_NAME"

          /usr/bin/ditto \
            -c \
            -k \
            --keepParent \
            "$PAYLOAD_DIRECTORY" \
            "$IPA_PATH"

          if [[ ! -s "$IPA_PATH" ]]; then
            echo "::error::IPA creation produced an empty or missing file."
            exit 1
          fi

          /usr/bin/unzip -tq "$IPA_PATH"

          if ! /usr/bin/unzip -l "$IPA_PATH" |
            grep -Eq 'Payload/[^/]+\.app/Info\.plist'
          then
            echo "::error::The IPA does not contain a valid Payload application."
            exit 1
          fi

          shasum -a 256 "$IPA_PATH" |
            tee "$IPA_PATH.sha256"

          echo "Created unsigned IPA:"
          ls -lh "$IPA_PATH" "$IPA_PATH.sha256"

          echo "IPA contents:"
          /usr/bin/unzip -l "$IPA_PATH" | head -100

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v7
        with:
          name: T3-Code-iOS-Unsigned
          path: |
            ${{ github.workspace }}/source/apps/mobile/output/T3-Code-unsigned.ipa
            ${{ github.workspace }}/source/apps/mobile/output/T3-Code-unsigned.ipa.sha256
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: T3-Code-iOS-Build-Logs
          path: |
            ${{ github.workspace }}/source/apps/mobile/*.log
            ${{ github.workspace }}/source/apps/mobile/ios/Podfile
            ${{ github.workspace }}/source/apps/mobile/ios/Podfile.lock
            ${{ github.workspace }}/source/apps/mobile/ios/*.xcodeproj/project.pbxproj
            ${{ github.workspace }}/source/apps/mobile/ios/*.xcodeproj/xcshareddata/xcschemes/*.xcscheme
            ${{ github.workspace }}/source/apps/mobile/ios/*.xcworkspace/contents.xcworkspacedata
            ${{ github.workspace }}/source/apps/mobile/ios/*.xcworkspace/xcshareddata/swiftpm/Package.resolved
          if-no-files-found: ignore
          retention-days: 7
          compression-level: 6
