name: Build Unsigned T3 Code IPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ios:
    name: Build unsigned iOS IPA
    runs-on: macos-15
    timeout-minutes: 90

    env:
      APP_VARIANT: production
      EXPO_NO_GIT_STATUS: "1"
      CI: "1"

      # Generates a reduced-capability build that is easier to sideload.
      T3CODE_IOS_PERSONAL_TEAM: "1"

      # Change this when needed.
      T3CODE_IOS_PERSONAL_TEAM_BUNDLE_ID: com.t3.t3code

    steps:
      - name: Checkout T3 Code
        uses: actions/checkout@v6

      - name: Select Xcode 26.3
        shell: bash
        run: |
          set -euo pipefail

          XCODE_PATH="/Applications/Xcode_26.3.app"

          if [[ ! -d "$XCODE_PATH" ]]; then
            echo "Xcode 26.3 was not found."
            echo "Installed Xcode versions:"
            ls -1 /Applications | grep '^Xcode' || true
            exit 1
          fi

          sudo xcode-select \
            --switch "$XCODE_PATH/Contents/Developer"

          echo "Selected Xcode:"
          xcodebuild -version

          echo "Selected Swift:"
          xcrun swift --version

      - name: Set up Vite+ and Node
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Display tool versions
        shell: bash
        run: |
          set -euo pipefail

          node --version
          vp --version
          pod --version
          xcodebuild -version
          xcrun swift --version

      - name: Generate the native iOS project
        working-directory: apps/mobile
        shell: bash
        run: |
          set -euo pipefail

          ./node_modules/.bin/expo prebuild \
            --clean \
            --platform ios

      - name: Install CocoaPods dependencies
        working-directory: apps/mobile
        shell: bash
        run: |
          set -euo pipefail

          pod install \
            --project-directory=ios

      - name: Locate Xcode workspace
        id: workspace
        working-directory: apps/mobile
        shell: bash
        run: |
          set -euo pipefail

          WORKSPACE="$(
            find ios \
              -maxdepth 1 \
              -type d \
              -name '*.xcworkspace' \
              -print \
              -quit
          )"

          if [[ -z "$WORKSPACE" ]]; then
            echo "No Xcode workspace was generated."
            find ios -maxdepth 2 -print || true
            exit 1
          fi

          echo "Workspace: $WORKSPACE"
          echo "path=$WORKSPACE" >> "$GITHUB_OUTPUT"

      - name: Resolve Swift package dependencies
        working-directory: apps/mobile
        shell: bash
        run: |
          set -euo pipefail

          xcodebuild \
            -resolvePackageDependencies \
            -workspace "${{ steps.workspace.outputs.path }}"

      - name: Locate Xcode scheme
        id: scheme
        working-directory: apps/mobile
        shell: bash
        run: |
          set -euo pipefail

          JSON_FILE="$RUNNER_TEMP/t3code-xcode-list.json"

          xcodebuild \
            -workspace "${{ steps.workspace.outputs.path }}" \
            -list \
            -json \
            > "$JSON_FILE"

          echo "Xcode workspace information:"
          cat "$JSON_FILE"

          SCHEME="$(
            python3 - "$JSON_FILE" <<'PY'
          import json
          import pathlib
          import sys

          path = pathlib.Path(sys.argv[1])

          with path.open("r", encoding="utf-8") as file:
              data = json.load(file)

          schemes = data.get("workspace", {}).get("schemes", [])

          usable = [
              scheme
              for scheme in schemes
              if "pod" not in scheme.lower()
          ]

          preferred = [
              scheme
              for scheme in usable
              if "t3" in scheme.lower()
          ]

          choices = preferred or usable

          if not choices:
              raise SystemExit("No usable Xcode scheme was found.")

          print(choices[0])
          PY
          )"

          if [[ -z "$SCHEME" ]]; then
            echo "Scheme detection produced an empty result."
            exit 1
          fi

          echo "Selected scheme: $SCHEME"
          echo "name=$SCHEME" >> "$GITHUB_OUTPUT"

      - name: Build unsigned Release app
        working-directory: apps/mobile
        shell: bash
        run: |
          set -o pipefail

          rm -rf build

          xcodebuild \
            -workspace "${{ steps.workspace.outputs.path }}" \
            -scheme "${{ steps.scheme.outputs.name }}" \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$PWD/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            ONLY_ACTIVE_ARCH=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            build \
            | tee xcodebuild.log

      - name: Find built application
        id: app
        working-directory: apps/mobile
        shell: bash
        run: |
          set -euo pipefail

          APP_PATH="$(
            find build/Build/Products/Release-iphoneos \
              -maxdepth 1 \
              -type d \
              -name '*.app' \
              -print \
              -quit
          )"

          if [[ -z "$APP_PATH" ]]; then
            echo "The built application could not be found."
            find build/Build/Products -maxdepth 5 -print || true
            exit 1
          fi

          echo "Built app: $APP_PATH"
          echo "path=$APP_PATH" >> "$GITHUB_OUTPUT"

      - name: Remove existing signing data
        working-directory: apps/mobile
        shell: bash
        run: |
          set -euo pipefail

          APP_PATH="${{ steps.app.outputs.path }}"

          find "$APP_PATH" \
            -type d \
            -name '_CodeSignature' \
            -prune \
            -exec rm -rf {} +

          find "$APP_PATH" \
            -type f \
            -name 'embedded.mobileprovision' \
            -delete

          find "$APP_PATH" \
            -type f \
            -name 'CodeResources' \
            -delete

      - name: Package unsigned IPA
        working-directory: apps/mobile
        shell: bash
        run: |
          set -euo pipefail

          APP_PATH="${{ steps.app.outputs.path }}"
          OUTPUT_DIRECTORY="$PWD/output"
          PAYLOAD_DIRECTORY="$OUTPUT_DIRECTORY/Payload"
          IPA_PATH="$OUTPUT_DIRECTORY/T3-Code-unsigned.ipa"

          rm -rf "$OUTPUT_DIRECTORY"
          mkdir -p "$PAYLOAD_DIRECTORY"

          /usr/bin/ditto \
            "$APP_PATH" \
            "$PAYLOAD_DIRECTORY/$(basename "$APP_PATH")"

          cd "$OUTPUT_DIRECTORY"

          /usr/bin/ditto \
            -c \
            -k \
            --sequesterRsrc \
            --keepParent \
            Payload \
            "$IPA_PATH"

          echo "Created IPA:"
          ls -lh "$IPA_PATH"

          echo "IPA contents:"
          unzip -l "$IPA_PATH" | head -100

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: T3-Code-iOS-Unsigned
          path: apps/mobile/output/T3-Code-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: T3-Code-iOS-Build-Logs
          path: |
            apps/mobile/xcodebuild.log
            apps/mobile/ios/Podfile.lock
            apps/mobile/ios/*.xcworkspace/xcshareddata/swiftpm/Package.resolved
          if-no-files-found: ignore
          retention-days: 7
