name: Build iOS iPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ios:
    name: Build iOS iPA
    runs-on: macos-26
    timeout-minutes: 120

    env:
      CI: "1"
      APP_VARIANT: production
      EXPO_NO_GIT_STATUS: "1"

      # Produces the reduced-capability Personal Team build.
      T3CODE_IOS_PERSONAL_TEAM: "1"

      # Bundle identifier embedded in the unsigned app.
      T3CODE_IOS_PERSONAL_TEAM_BUNDLE_ID: com.t3.t3code

    steps:
      - name: Checkout T3 Code
        uses: actions/checkout@v6
        with:
          repository: pingdotgg/t3code
          ref: main
          fetch-depth: 1
          submodules: false
          persist-credentials: false

      - name: Select Xcode 26.6
        shell: bash
        run: |
          set -euo pipefail

          XCODE_PATH="/Applications/Xcode_26.6.app"

          if [[ ! -d "$XCODE_PATH" ]]; then
            echo "::error::Xcode 26.6 was not found."
            echo "Installed Xcode versions:"
            find /Applications \
              -maxdepth 1 \
              -type d \
              -name 'Xcode*.app' \
              -print
            exit 1
          fi

          sudo xcode-select \
            --switch "$XCODE_PATH/Contents/Developer"

          echo "Selected Xcode:"
          xcodebuild -version

          echo "Selected Swift:"
          xcrun swift --version

          echo "Selected iOS SDK:"
          xcrun --sdk iphoneos --show-sdk-version

      - name: Set up Vite+ and Node
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Show tool versions
        shell: bash
        run: |
          set -euo pipefail

          echo "Node:"
          node --version

          echo "Vite+:"
          vp --version

          echo "CocoaPods:"
          pod --version

          echo "Xcode:"
          xcodebuild -version

          echo "Swift:"
          xcrun swift --version

      - name: Generate native iOS project
        working-directory: apps/mobile
        shell: bash
        run: |
          set -euo pipefail
          set -o pipefail

          rm -rf ios build output

          ./node_modules/.bin/expo prebuild \
            --clean \
            --platform ios \
            2>&1 | tee expo-prebuild.log

      - name: Install CocoaPods
        working-directory: apps/mobile
        shell: bash
        run: |
          set -euo pipefail
          set -o pipefail

          pod install \
            --project-directory=ios \
            2>&1 | tee pod-install.log

      - name: Locate workspace and scheme
        id: xcode
        working-directory: apps/mobile
        shell: bash
        run: |
          set -euo pipefail

          WORKSPACE="$(
            find ios \
              -maxdepth 1 \
              -type d \
              -name '*.xcworkspace' \
              ! -name 'Pods.xcworkspace' \
              -print \
              -quit
          )"

          if [[ -z "$WORKSPACE" ]]; then
            echo "::error::No application Xcode workspace was found."
            find ios -maxdepth 3 -print || true
            exit 1
          fi

          PROJECT="$(
            find ios \
              -maxdepth 1 \
              -type d \
              -name '*.xcodeproj' \
              ! -name 'Pods.xcodeproj' \
              -print \
              -quit
          )"

          if [[ -z "$PROJECT" ]]; then
            echo "::error::No application Xcode project was found."
            find ios -maxdepth 3 -print || true
            exit 1
          fi

          PROJECT_NAME="$(basename "$PROJECT" .xcodeproj)"

          PREFERRED_SCHEME_FILE="$PROJECT/xcshareddata/xcschemes/$PROJECT_NAME.xcscheme"
          SCHEME_FILE=""

          if [[ -f "$PREFERRED_SCHEME_FILE" ]]; then
            SCHEME_FILE="$PREFERRED_SCHEME_FILE"
          else
            SCHEME_FILE="$(
              find ios \
                -type f \
                -path '*/xcshareddata/xcschemes/*.xcscheme' \
                ! -path '*/Pods/*' \
                -print \
                -quit
            )"
          fi

          if [[ -z "$SCHEME_FILE" || ! -f "$SCHEME_FILE" ]]; then
            echo "::error::No shared application scheme was found."
            echo "Available scheme files:"
            find ios -type f -name '*.xcscheme' -print || true
            exit 1
          fi

          SCHEME="$(basename "$SCHEME_FILE" .xcscheme)"

          if [[ -z "$SCHEME" ]]; then
            echo "::error::The detected Xcode scheme was empty."
            exit 1
          fi

          echo "Workspace: $WORKSPACE"
          echo "Project:   $PROJECT"
          echo "Scheme:    $SCHEME"
          echo "Scheme file: $SCHEME_FILE"

          {
            echo "workspace=$WORKSPACE"
            echo "project=$PROJECT"
            echo "scheme=$SCHEME"
          } >> "$GITHUB_OUTPUT"

      - name: Verify detected scheme
        working-directory: apps/mobile
        shell: bash
        run: |
          set -euo pipefail
          set -o pipefail

          xcodebuild \
            -workspace "${{ steps.xcode.outputs.workspace }}" \
            -scheme "${{ steps.xcode.outputs.scheme }}" \
            -configuration Release \
            -showBuildSettings \
            2>&1 | tee xcode-build-settings.log

      - name: Resolve Swift package dependencies
        working-directory: apps/mobile
        shell: bash
        run: |
          set -euo pipefail
          set -o pipefail

          mkdir -p build/SourcePackages

          xcodebuild \
            -workspace "${{ steps.xcode.outputs.workspace }}" \
            -scheme "${{ steps.xcode.outputs.scheme }}" \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -clonedSourcePackagesDirPath "$PWD/build/SourcePackages" \
            -resolvePackageDependencies \
            2>&1 | tee swiftpm-resolve.log

      - name: Build unsigned Release app
        working-directory: apps/mobile
        shell: bash
        run: |
          set -euo pipefail
          set -o pipefail

          rm -rf build/Build build/Logs build/Info.plist

          xcodebuild \
            -workspace "${{ steps.xcode.outputs.workspace }}" \
            -scheme "${{ steps.xcode.outputs.scheme }}" \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$PWD/build" \
            -clonedSourcePackagesDirPath "$PWD/build/SourcePackages" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            EXPANDED_CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            AD_HOC_CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            build \
            2>&1 | tee xcodebuild.log

      - name: Locate built application
        id: app
        working-directory: apps/mobile
        shell: bash
        run: |
          set -euo pipefail

          PRODUCTS_DIRECTORY="$PWD/build/Build/Products/Release-iphoneos"

          if [[ ! -d "$PRODUCTS_DIRECTORY" ]]; then
            echo "::error::Release-iphoneos products directory does not exist."
            find build -maxdepth 5 -print || true
            exit 1
          fi

          APP_PATH="$(
            find "$PRODUCTS_DIRECTORY" \
              -mindepth 1 \
              -maxdepth 1 \
              -type d \
              -name '*.app' \
              -print \
              -quit
          )"

          if [[ -z "$APP_PATH" ]]; then
            echo "::error::No built .app was found."
            find "$PRODUCTS_DIRECTORY" -maxdepth 4 -print || true
            exit 1
          fi

          INFO_PLIST="$APP_PATH/Info.plist"

          if [[ ! -f "$INFO_PLIST" ]]; then
            echo "::error::The built app does not contain Info.plist."
            exit 1
          fi

          BUNDLE_ID="$(
            /usr/libexec/PlistBuddy \
              -c 'Print :CFBundleIdentifier' \
              "$INFO_PLIST"
          )"

          EXECUTABLE_NAME="$(
            /usr/libexec/PlistBuddy \
              -c 'Print :CFBundleExecutable' \
              "$INFO_PLIST"
          )"

          if [[ ! -f "$APP_PATH/$EXECUTABLE_NAME" ]]; then
            echo "::error::The app executable is missing."
            exit 1
          fi

          echo "Built app: $APP_PATH"
          echo "Bundle ID: $BUNDLE_ID"
          echo "Executable: $EXECUTABLE_NAME"

          echo "path=$APP_PATH" >> "$GITHUB_OUTPUT"
          echo "bundle_id=$BUNDLE_ID" >> "$GITHUB_OUTPUT"

      - name: Remove existing signing data
        working-directory: apps/mobile
        shell: bash
        run: |
          set -euo pipefail

          APP_PATH="${{ steps.app.outputs.path }}"

          find "$APP_PATH" \
            -type d \
            -name '_CodeSignature' \
            -prune \
            -exec rm -rf '{}' +

          find "$APP_PATH" \
            -type f \
            -name 'embedded.mobileprovision' \
            -delete

          find "$APP_PATH" \
            -type f \
            -name 'CodeResources' \
            -delete

          echo "Remaining signing-related files:"
          find "$APP_PATH" \
            \( \
              -name '_CodeSignature' \
              -o -name 'embedded.mobileprovision' \
              -o -name 'CodeResources' \
            \) \
            -print || true

      - name: Package unsigned IPA
        working-directory: apps/mobile
        shell: bash
        run: |
          set -euo pipefail

          APP_PATH="${{ steps.app.outputs.path }}"
          APP_NAME="$(basename "$APP_PATH")"

          OUTPUT_DIRECTORY="$PWD/output"
          PAYLOAD_DIRECTORY="$OUTPUT_DIRECTORY/Payload"
          IPA_PATH="$OUTPUT_DIRECTORY/T3-Code-unsigned.ipa"

          rm -rf "$OUTPUT_DIRECTORY"
          mkdir -p "$PAYLOAD_DIRECTORY"

          /usr/bin/ditto \
            "$APP_PATH" \
            "$PAYLOAD_DIRECTORY/$APP_NAME"

          cd "$OUTPUT_DIRECTORY"

          /usr/bin/ditto \
            -c \
            -k \
            --sequesterRsrc \
            --keepParent \
            Payload \
            "$IPA_PATH"

          if [[ ! -s "$IPA_PATH" ]]; then
            echo "::error::IPA creation failed or produced an empty file."
            exit 1
          fi

          echo "Created unsigned IPA:"
          ls -lh "$IPA_PATH"

          echo "IPA root contents:"
          unzip -l "$IPA_PATH" | head -100

          if ! unzip -l "$IPA_PATH" | grep -q "Payload/.*\.app/Info.plist"; then
            echo "::error::The IPA does not contain a valid Payload app."
            exit 1
          fi

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v7
        with:
          name: T3-Code-iOS-Unsigned
          path: apps/mobile/output/T3-Code-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: T3-Code-iOS-Build-Logs
          path: |
            apps/mobile/expo-prebuild.log
            apps/mobile/pod-install.log
            apps/mobile/xcode-build-settings.log
            apps/mobile/swiftpm-resolve.log
            apps/mobile/xcodebuild.log
            apps/mobile/ios/Podfile
            apps/mobile/ios/Podfile.lock
            apps/mobile/ios/*.xcodeproj/project.pbxproj
            apps/mobile/ios/*.xcodeproj/xcshareddata/xcschemes/*.xcscheme
            apps/mobile/ios/*.xcworkspace/contents.xcworkspacedata
            apps/mobile/ios/*.xcworkspace/xcshareddata/swiftpm/Package.resolved
            apps/mobile/build/SourcePackages/checkouts/*/Package.swift
          if-no-files-found: ignore
          retention-days: 7
